# Netlify configuration for this Next.js app.
#
# Deploy by CONNECTING THIS GITHUB REPO (Add new site → Import an existing
# project → GitHub). Do NOT drag-and-drop a ZIP, and do NOT install the
# Netlify "Supabase" extension — this app reaches Supabase through the
# SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY environment variables alone, with
# nothing to run at build time.
#
# Netlify auto-detects Next.js and installs its official runtime, which also
# sets the publish directory — so we deliberately keep this minimal and do
# NOT declare the plugin or a publish dir ourselves (avoids version conflicts).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # SUPABASE_URL is a public API endpoint, not a secret (only the
  # service_role key is), so exclude it from Netlify's secrets scanner —
  # otherwise the scanner blocks the build if the URL ever appears in a file.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"
