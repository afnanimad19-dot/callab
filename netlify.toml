# Netlify configuration for this Next.js app.
#
# IMPORTANT: deploy by CONNECTING THIS GITHUB REPO (Add new site → Import an
# existing project → GitHub). Do NOT drag-and-drop a ZIP — that skips the
# build step and cannot run a Next.js server app.
#
# Netlify auto-detects Next.js and installs its official runtime, which sets
# the publish directory itself — so we intentionally do NOT set `publish`.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
